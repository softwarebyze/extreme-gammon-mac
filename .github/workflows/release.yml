name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pack-zip.py dist/Extreme-Gammon-for-Mac.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/Extreme-Gammon-for-Mac.zip \
            dist/Extreme-Gammon-for-Linux.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
